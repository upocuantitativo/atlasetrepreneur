<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Method Atlas — Variations</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; font-family: "Inter Tight", system-ui, sans-serif; background: #1a1a22; }
  .iframe-card { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;

  function App() {
    return (
      <DesignCanvas title="The Method Atlas — Variations">
        <DCSection id="immersive" title="A. Immersive — serif on midnight blue">
          <DCArtboard id="dark" label="Serif Dark · Cinematic 3D" width={1280} height={820}>
            <iframe className="iframe-card" src="Method Atlas.html" />
          </DCArtboard>
        </DCSection>

        <DCSection id="paper" title="B. Manuscript — warm paper, organic feel">
          <DCArtboard id="paper" label="Serif Paper · Lab notebook" width={1280} height={820}>
            <iframe className="iframe-card" src="method-atlas-paper.html" />
          </DCArtboard>
        </DCSection>

        <DCSection id="editorial" title="C. Editorial — clean journal aesthetic">
          <DCArtboard id="editorial" label="Editorial · Bright multicolor" width={1280} height={820}>
            <iframe className="iframe-card" src="method-atlas-editorial.html" />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
